<!doctype html>
<html lang="es-PY">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2D5A43" />
    <meta
      name="description"
      content="Centro Qi · Terapias Orientales en Villa Morra, Asunción. Reservá tu sesión de acupuntura, auriculoterapia, reflexología o moxibustión desde el celular."
    />

    <!--
      Tipografia propia, no de fonts.googleapis.com: una hoja de estilos de un tercero
      bloquea el primer pintado y suma dos handshakes. Estos dos archivos son los unicos
      que descarga una pagina en castellano (los subconjuntos latin), y precargarlos hace
      que lleguen antes del primer pintado: el texto se dibuja ya con su fuente
      definitiva, sin el salto de maquetado que Core Web Vitals cobra como CLS.
      `crossorigin` es obligatorio incluso en el mismo origen: las fuentes se piden
      siempre en modo CORS y sin el atributo el navegador descarga el archivo dos veces.
    -->
    <link
      rel="preload"
      href="/fonts/jakarta-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      La foto del encabezado de la portada. `media` importa: la foto está oculta hasta
      1024px (en el celular empujaría el botón de reserva fuera de la primera pantalla),
      así que precargarla siempre sería gastarle 64 kB de datos móviles a quien nunca la
      va a ver. Arriba de ese ancho es el elemento más grande de la primera pantalla —el
      Largest Contentful Paint— y pedirla antes de que el navegador descubra el <img>
      adelanta el momento en que la página se ve cargada.
    -->
    <link
      rel="preload"
      href="/img/acupuntura.jpg"
      as="image"
      type="image/jpeg"
      media="(min-width: 1024px)"
      fetchpriority="high"
    />

    <title>Centro Qi · Terapias Orientales en Asunción</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
